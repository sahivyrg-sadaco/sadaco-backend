# Nightly backup of the SADACO database (Neon Postgres).
#
# Runs every night, and on demand (Actions tab → "Nightly database backup" → Run workflow).
# Each run saves a compressed dump as a private download on the run's page,
# kept for 30 days. Needs one repository secret: BACKUP_DATABASE_URL
# (the Neon connection string; see docs/BACKUPS.md).
name: Nightly database backup

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC, about 3 am in Miami
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04     # pinned, so GitHub's runner upgrades don't change it
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The BACKUP_DATABASE_URL secret is missing. Add it under Settings → Secrets and variables → Actions (see docs/BACKUPS.md)."
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::BACKUP_DATABASE_URL doesn't look like a connection string. It should start with postgresql://"; exit 1 ;;
          esac

      - name: Find the database's PostgreSQL version
        id: ver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null
          if ! num=$(psql "$DATABASE_URL" -tAc 'SHOW server_version_num' 2>err.txt); then
            echo "::error::Could not connect to the database: $(tr '\n' ' ' < err.txt). Check the password in BACKUP_DATABASE_URL matches Neon's."
            exit 1
          fi
          major=$(( ${num// /} / 10000 ))
          echo "Database runs PostgreSQL $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Install matching backup tools
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq "postgresql-client-${{ steps.ver.outputs.major }}" > /dev/null
          "/usr/lib/postgresql/${{ steps.ver.outputs.major }}/bin/pg_dump" --version

      - name: Dump the database
        run: |
          stamp=$(date -u +%Y-%m-%d)
          "/usr/lib/postgresql/${{ steps.ver.outputs.major }}/bin/pg_dump" "$DATABASE_URL" \
            --format=custom --no-owner --no-privileges \
            --file "sadaco-$stamp.dump"
          ls -lh sadaco-*.dump

      - name: Keep the dump for 30 days
        uses: actions/upload-artifact@v5
        with:
          name: sadaco-db-${{ github.run_number }}
          path: sadaco-*.dump
          retention-days: 30
          if-no-files-found: error
