# Nightly backup of the SADACO database (Neon Postgres).
#
# Runs every night, and on demand (Actions tab → "Nightly database backup" → Run workflow).
# Each run saves a compressed dump as a private download on the run's page,
# kept for 30 days. Needs one repository secret: BACKUP_DATABASE_URL
# (the Neon connection string; see docs/BACKUPS.md).
name: Nightly database backup

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC, about 3 am in Miami
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The BACKUP_DATABASE_URL secret is not set. See docs/BACKUPS.md."
            exit 1
          fi
          stamp=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --format=custom --no-owner --no-privileges \
            --file "sadaco-$stamp.dump"
          ls -lh sadaco-*.dump

      - name: Keep the dump for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: sadaco-db-${{ github.run_number }}
          path: sadaco-*.dump
          retention-days: 30
          if-no-files-found: error
